controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster
    rl_quadruped_controller:
      type: rl_quadruped_controller/LeggedGymController
imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
rl_quadruped_controller:
  ros__parameters:
    update_rate: 200
    robot_pkg: go2_description
    model_folder: stairs_trot
    joints:
    - FL_hip_joint
    - FL_thigh_joint
    - FL_calf_joint
    - FR_hip_joint
    - FR_thigh_joint
    - FR_calf_joint
    - RL_hip_joint
    - RL_thigh_joint
    - RL_calf_joint
    - RR_hip_joint
    - RR_thigh_joint
    - RR_calf_joint
    stand_pos:
    - 0.1
    - 0.8
    - -1.5
    - -0.1
    - 0.8
    - -1.5
    - 0.1
    - 1.0
    - -1.5
    - -0.1
    - 1.0
    - -1.5
    down_pos:
    - 0.01
    - 1.27
    - -2.7
    - -0.01
    - 1.27
    - -2.7
    - 0.3
    - 1.31
    - -2.7
    - -0.3
    - 1.31
    - -2.7
    command_interfaces:
    - effort
    - position
    - velocity
    - kp
    - kd
    state_interfaces:
    - effort
    - position
    - velocity
    feet_names:
    - FL_foot
    - FR_foot
    - RL_foot
    - RR_foot
    imu_name: imu_sensor
    base_name: base
    imu_interfaces:
    - orientation.w
    - orientation.x
    - orientation.y
    - orientation.z
    - angular_velocity.x
    - angular_velocity.y
    - angular_velocity.z
    - linear_acceleration.x
    - linear_acceleration.y
    - linear_acceleration.z
    use_rl_thread: false
